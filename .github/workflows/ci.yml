name: Registry CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: sodium
                  coverage: none
            - run: php -l scripts/ensure-signing-key.php
            - run: php -l scripts/sign-registry.php
            - run: php -l scripts/update-module.php
            - run: php -l scripts/validate-registry.php
            - run: php -l scripts/verify-registry.php
            - run: php scripts/validate-registry.php
            - name: Verify signed catalog on master
              if: github.event_name == 'push' && github.ref == 'refs/heads/master'
              run: php scripts/verify-registry.php
