name: Rebuild module registry

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:
    repository_dispatch:
        types: [module-released]

permissions:
    contents: read

concurrency:
    group: registry-rebuild
    cancel-in-progress: false

jobs:
    rebuild:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
            pull-requests: write

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
              with:
                  php-version: '8.5'
                  extensions: sodium, zip, curl, mbstring
                  coverage: none
                  tools: composer:v2

            - name: Preserve releases already awaiting review
              id: pending
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  count="$(gh pr list --head chore/registry-rebuild --state open --json number --jq 'length')"
                  if [ "$count" -gt 0 ]; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "A generated release PR is awaiting review; its artifacts will not be overwritten."
                  fi

            - name: Install registry tooling
              if: steps.pending.outputs.exists != 'true'
              run: composer install --no-dev --no-interaction --prefer-dist --no-progress

            - name: Rebuild registry from module releases
              if: steps.pending.outputs.exists != 'true'
              run: php scripts/rebuild-registry.php
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Validate registry
              if: steps.pending.outputs.exists != 'true'
              run: php scripts/validate-registry.php

            - name: Detect changes
              id: diff
              if: steps.pending.outputs.exists != 'true'
              run: |
                  if git diff --quiet -- registry.json packages.json; then
                      echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                      echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Open pull request
              if: steps.diff.outputs.changed == 'true'
              uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
              with:
                  commit-message: 'chore(registry): rebuild module catalog'
                  branch: chore/registry-rebuild
                  title: 'chore(registry): rebuild module catalog'
                  body: |
                      Proposed catalog rebuild from module release tags. Review each release's source_ref, module CI, host integration evidence, migrations, permissions, and rollback impact.

                      The Ed25519 signature was removed by the rebuild. A maintainer
                      must sign `registry.json` and merge this branch. CI will not
                      publish an unsigned catalog to `master`.

                      Push the signed commit with maintainer credentials to run PR checks, or manually dispatch Registry CI on this branch. PRs opened with GITHUB_TOKEN do not automatically trigger other workflows.
                  add-paths: |
                      registry.json
                      packages.json
