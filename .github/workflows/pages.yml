name: Publish Module Registry

on:
    push:
        branches: [master]
        paths:
            - 'registry.json'
            - 'packages.json'
            - 'registry-public-key.txt'
            - 'scripts/**'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.5'
                  extensions: sodium
                  coverage: none
            - run: php scripts/validate-registry.php
            - run: php scripts/verify-registry.php
            - run: mkdir -p dist && cp registry.json packages.json registry-public-key.txt dist/
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v4
